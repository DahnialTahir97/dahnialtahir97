name: MentorMe Maven Build

on:
  push:
    paths:
      - "MentorMe/**"
      - ".github/workflows/mentorme-maven.yml"
  pull_request:
    paths:
      - "MentorMe/**"
      - ".github/workflows/mentorme-maven.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MentorMe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode verify
      - name: Verify standard Docker image
        run: docker build --tag mentorme:ci .
      - name: Verify Vercel container image
        run: docker build --file Dockerfile.vercel --tag mentorme:vercel-ci .
