<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | MentorMe</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth-wrap"><section class="auth-card"><a class="brand" th:href="@{/}">Mentor<span>Me</span></a><h1>Welcome back</h1><p>Sign in to continue your mentoring journey.</p><p class="notice" th:if="${param.error}">Email or password is incorrect.</p><p class="success" th:if="${success}" th:text="${success}"></p><form method="post" th:action="@{/login}"><label>Email</label><input type="email" name="username" required maxlength="100"><label>Password</label><input type="password" name="password" required><button class="primary-button full" type="submit">Login</button></form><p>New to MentorMe? <a th:href="@{/register}">Create an account</a></p></section></main></body></html>
