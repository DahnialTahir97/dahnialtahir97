<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student | MentorMe</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/}">Mentor<span>Me</span></a><form th:action="@{/logout}" method="post"><button class="nav-register" type="submit">Logout</button></form></header><main class="dashboard"><p class="eyebrow">STUDENT SPACE</p><h1>Find your peer tutor</h1><p>Explore academic subjects and peer mentoring.</p><div class="feature-grid"><article th:each="s : ${subjects}"><span th:text="${s.subjectCode}">CODE</span><h3 th:text="${s.subjectName}">Subject</h3></article></div><p class="notice" th:if="${#lists.isEmpty(subjects)}">No subjects have been added yet.</p></main></body></html>
