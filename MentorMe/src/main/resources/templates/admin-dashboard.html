<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | MentorMe</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="topbar"><a class="brand" th:href="@{/}">Mentor<span>Me</span></a><form th:action="@{/logout}" method="post"><button class="nav-register" type="submit">Logout</button></form></header>
<main class="dashboard"><p class="eyebrow">ADMINISTRATION</p><h1>Admin dashboard</h1><p>Platform overview and recent mentoring activity.</p>
<div class="stats"><article>Users <strong th:text="${userCount}">0</strong></article><article>Faculties <strong th:text="${facultyCount}">0</strong></article><article>Subjects <strong th:text="${subjectCount}">0</strong></article><article>Bookings <strong th:text="${bookingCount}">0</strong></article></div>
<h2>Recent bookings</h2><div class="feature-grid" th:if="${recentBookings != null and !#lists.isEmpty(recentBookings)}"><article th:each="b : ${recentBookings}"><h3>Booking #<span th:text="${b.booking_id}">1</span></h3><p>Student: <span th:text="${b.student_name}">Student</span></p><p>Tutor: <span th:text="${b.tutor_name}">Tutor</span></p><p>Date: <span th:text="${b.session_date}">Date</span></p><p>Status: <strong th:text="${b.status}">PENDING</strong></p></article></div>
<p class="notice" th:if="${recentBookings == null or #lists.isEmpty(recentBookings)}">No booking activity yet.</p>
</main></body></html>
