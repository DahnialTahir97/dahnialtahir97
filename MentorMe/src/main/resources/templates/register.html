<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | MentorMe</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth-wrap"><section class="auth-card"><a class="brand" th:href="@{/}">Mentor<span>Me</span></a><h1>Create your account</h1><p>Join the MentorMe academic community.</p><p class="notice" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/register}"><label>Full name</label><input name="fullName" required maxlength="100"><label>Email</label><input type="email" name="email" required maxlength="100"><label>Password</label><input type="password" name="password" required minlength="8" maxlength="72"><label>Faculty</label><select name="facultyId" required><option value="">Select faculty</option><option th:each="f : ${faculties}" th:value="${f.facultyId}" th:text="${f.name}"></option></select><label>Register as</label><select name="role" required><option value="STUDENT">Student</option><option value="TUTOR">Tutor</option></select><button class="primary-button full" type="submit">Create account</button></form><p>Already registered? <a th:href="@{/login}">Login</a></p></section></main></body></html>
