spring.application.name=MentorMe
server.port=${PORT:8080}

# Local development. Set DB values using environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mentorme_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The SQL schema is authoritative; Hibernate must not alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never
spring.thymeleaf.cache=false